<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>SplitLah</title>
  <meta name="description" content="Split trip and occasion expenses with friends.">
  <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151917" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SplitLah">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
  // Boot watchdog: if the app hasn't started after a few seconds, say why instead of spinning forever.
  (function () {
    var errs = [];
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t !== window && (t.src || t.href)) errs.push('Could not load ' + String(t.src || t.href).split('/').slice(-2).join('/'));
      else if (e.message) errs.push(e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason; errs.push(String((r && (r.code || r.message)) || r));
    });
    function show(title, body) {
      if (window.__splitlahBooted) return;
      var app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '<div class="brand">Split<span>Lah</span></div><div class="banner warn"><span>⚠️</span><div><b>' + title + '</b><br>' + body +
        (errs.length ? '<br><br><small style="word-break:break-word">Details: ' + errs.slice(0, 4).map(function (x) { return x.replace(/[<>&]/g, ''); }).join(' · ') + '</small>' : '') +
        '</div></div><button class="btn primary block" onclick="location.reload()">Try again</button>';
    }
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        show('This needs to be opened from a website, not a file.',
          'Browsers block apps like this when you double-click <code>index.html</code>. Upload the whole folder to Netlify (drag it onto <b>app.netlify.com/drop</b>) and open the <b>https://</b> link it gives you. See README step 2.');
      });
      return;
    }
    setTimeout(function () {
      show('SplitLah is taking too long to start.',
        'Check your internet connection. If you just set up Firebase, check that <b>config.js</b> has your keys and that <b>Anonymous</b> sign-in is enabled.');
    }, 15000);
  })();
  </script>
  <script src="config.js" onerror="void 0"></script>
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="boot"><div class="boot-mark">S/</div></div>
  </main>
  <div id="sheet-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
